<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jirayu Chomthong - Full-Stack Developer</title>
  <desc id="desc">A subtle animated space, astronomy and physics themed banner</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.52" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#120b2e"/>
    </linearGradient>

    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .star { fill: #e0f2fe; }
      .orbit { fill: none; stroke: #67e8f9; stroke-width: 1; stroke-opacity: 0.18; }
      .name {
        fill: #f8fafc;
        font: 500 54px 'Segoe UI', Arial, sans-serif;
        letter-spacing: 1px;
      }
      .role {
        fill: #67e8f9;
        font: 600 23px 'Segoe UI', Arial, sans-serif;
        letter-spacing: 3px;
      }
      .formula {
        fill: #c4b5fd;
        fill-opacity: 0.28;
        font: italic 18px Georgia, serif;
      }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#space)"/>
  <ellipse cx="910" cy="160" rx="360" ry="260" fill="url(#nebula)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <g opacity="0.75">
    <circle class="star" cx="55" cy="54" r="1.1"/>
    <circle class="star" cx="145" cy="102" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="268" cy="44" r="1"/>
    <circle class="star" cx="385" cy="92" r="1.3"/>
    <circle class="star" cx="510" cy="48" r="1.4"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="6.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="640" cy="88" r="1"/>
    <circle class="star" cx="755" cy="38" r="1.5"/>
    <circle class="star" cx="870" cy="84" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="1005" cy="45" r="1"/>
    <circle class="star" cx="1135" cy="112" r="1.5"/>
    <circle class="star" cx="92" cy="288" r="1.4"/>
    <circle class="star" cx="240" cy="320" r="1"/>
    <circle class="star" cx="420" cy="282" r="1.3"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="590" cy="326" r="1"/>
    <circle class="star" cx="730" cy="278" r="1.4"/>
    <circle class="star" cx="975" cy="315" r="1.2"/>
    <circle class="star" cx="1148" cy="270" r="1"/>
  </g>

  <g transform="translate(960 178) rotate(-14)">
    <ellipse class="orbit" rx="170" ry="58"/>
    <ellipse class="orbit" rx="130" ry="108" transform="rotate(58)"/>
    <ellipse class="orbit" rx="130" ry="108" transform="rotate(-58)"/>
    <circle r="16" fill="#a78bfa" opacity="0.72" filter="url(#glow)">
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cx="170" fill="#67e8f9" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M0 258 C80 230 145 286 225 258 S370 230 450 258 S595 286 675 258 S820 230 900 258 S1045 286 1200 250"
        fill="none" stroke="url(#spectrum)" stroke-width="1.4" stroke-dasharray="180 1250" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="1430;0" dur="11s" repeatCount="indefinite"/>
  </path>

  <text class="formula" x="795" y="64">E = mc²</text>
  <text class="formula" x="1075" y="292">ψ(x,t)</text>

  <g transform="translate(70 0)">
    <text class="name" x="0" y="172">Hey! I am Jirayu Chomthong</text>
    <text class="role" x="3" y="218">FULL-STACK DEVELOPER</text>
    <line x1="3" y1="237" x2="210" y2="237" stroke="#67e8f9" stroke-width="2" opacity="0.75">
      <animate attributeName="x2" values="55;210;55" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
